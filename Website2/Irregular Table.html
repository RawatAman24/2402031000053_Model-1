<!DOCTYPE html>
<html>
<head>
<style>
    table {
        border-collapse: collapse;
        width: 80%;
        text-align: center;
    }
    td {
        border: 1px solid black;
        padding: 10px;
    }
</style>
</head>
<body>
<table>
  <tr>
    <td colspan="3">A</td>
    <td colspan="7">B</td>
  </tr>
  <tr>
    <td colspan="2">C</td>
    <td colspan="2">D</td>
    <td>E</td>
    <td>F</td>
    <td colspan="2">G</td>
    <td>H</td>
    <td rowspan="2">J</td>
  </tr>
  <tr>
    <td colspan="3" rowspan="2">K</td>
    <td colspan="2">M</td>
    <td colspan="2">N</td>
    <td colspan="2">I</td>
  </tr>
  <tr>
    <td>L</td>
    <td>P</td>
    <td>Q</td>
    <td colspan="2">I</td>
    <td>H</td>
  </tr>
</table>
</body>
</html>
