<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boot Store</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
    body{
      background:#fff3e0;
    }
    h1{
      text-align:center;
      color:orange;
      margin:30px 0;
      font-weight:bold;
    }
    .carousel img{
      height:400px;
      object-fit:cover;
      border-radius:10px;
    }
    .products{
      padding:50px 20px;
    }
    .card{
      border:none;
      border-radius:15px;
      overflow:hidden;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
    .card:hover{
      transform:translateY(-8px);
    }
    .card img{
      height:250px;
      object-fit:cover;
    }
    .price{
      color:green;
      font-size:22px;
      font-weight:bold;
    }
    .old-price{
      text-decoration:line-through;
      color:red;
      margin-left:10px;
    }
    .btn-buy{
      background:orange;
      color:#fff;
      border:none;
    }
    .btn-buy:hover{
      background:darkorange;
      color:white;
    }
    .btn-cart{
      background:#222;
      color:#fff;
      border:none;
    }
    .btn-cart:hover{
      background:#000;
      color:white;
    }
    .popup{
      display:none;
      position:fixed;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      z-index:999;
    }
    .popup-content{
      background:#fff;
      width:350px;
      margin:8% auto;
      padding:20px;
      border-radius:10px;
      text-align:center;
      position:relative;
    }
    .popup-content img{
      width:100%;
      border-radius:10px;
      margin-bottom:15px;
    }
    .popup-content h2{
      color:orange;
      margin-bottom:10px;
    }
    .popup-content button{
      background:orange;
      color:#fff;
      border:none;
      padding:10px 20px;
      border-radius:5px;
      cursor:pointer;
    }
    .popup-content button:hover{
      background:darkorange;
    }
    .close{
      position:absolute;
      top:10px;
      right:15px;
      font-size:25px;
      color:red;
      cursor:pointer;
    }
    #topBtn{
      display:none;
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:99;
      border:none;
      outline:none;
      background:orange;
      color:#fff;
      padding:12px 18px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
    }
    #topBtn:hover{
      background:darkorange;
    }
  </style>
</head>
<body>
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close" id="closeBtn">&times;</span>
      <img src="shopping (1).webp" alt="Boot">
      <h2>Special Offer</h2>
      <p>Get 40% OFF on Boots Today!</p>
      <a href="#products">
        <button>Shop Now</button>
      </a>
    </div>
  </div>
  <h1>Welcome To Boot Store</h1>
  <div
    id="bootSlider"
    class="carousel slide container"
    data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="0"
        class="active">
      </button>
      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="1">
      </button>
      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="2">
      </button>
      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="3">
      </button>
      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="4">
      </button>
    </div>
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="shopping (1).webp" class="d-block w-100" alt="Boot">
      </div>
      <div class="carousel-item">
        <img src="shopping (2).webp" class="d-block w-100" alt="Boot">
      </div>
      <div class="carousel-item">
        <img src="shopping (3).webp" class="d-block w-100" alt="Boot">
      </div>
      <div class="carousel-item">
        <img src="shopping (4).webp" class="d-block w-100" alt="Boot">
      </div>
      <div class="carousel-item">
        <img src="shopping (5).webp" class="d-block w-100" alt="Boot">
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#bootSlider"
      data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#bootSlider"
      data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
  <section class="products container" id="products">
    <h1>Our Boots Collection</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <img src="shopping (1).webp" alt="Boot">
          <div class="card-body text-center">
            <h4>Leather Boot</h4>
            <p class="price"> 
              ₹3,599
              <span class="old-price">₹9999</span>
            </p>
            <button class="btn btn-buy me-2">
              <i class="fa-solid fa-bag-shopping"></i>
              Buy Now
            </button>
            <button class="btn btn-cart">
              <i class="fa-solid fa-cart-shopping"></i>
              Add To Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img src="shopping (2).webp" alt="Boot">
          <div class="card-body text-center">
            <h4>Winter Boot</h4>
            <p class="price">
              ₹4,599
              <span class="old-price">₹5499</span>
            </p>
            <button class="btn btn-buy me-2">
              <i class="fa-solid fa-bag-shopping"></i>
              Buy Now
            </button>
            <button class="btn btn-cart">
              <i class="fa-solid fa-cart-shopping"></i>
              Add To Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img src="shopping (3).webp" alt="Boot">
          <div class="card-body text-center">
            <h4>Classic Boot</h4>
            <p class="price">
              ₹3,999
              <span class="old-price">₹4,599</span>
            </p>
            <button class="btn btn-buy me-2">
              <i class="fa-solid fa-bag-shopping"></i>
              Buy Now
            </button>
            <button class="btn btn-cart">
              <i class="fa-solid fa-cart-shopping"></i>
              Add To Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <button onclick="topFunction()" id="topBtn">
    ↑
  </button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.onload = function(){
      document.getElementById("popup").style.display = "block";
    }
    document.getElementById("closeBtn").onclick = function(){
      document.getElementById("popup").style.display = "none";
    }
    let mybutton = document.getElementById("topBtn");
    window.onscroll = function(){
      if(document.body.scrollTop > 100 ||
         document.documentElement.scrollTop > 100){
        mybutton.style.display = "block";
      }
      else{
        mybutton.style.display = "none";
      }
    };
    function topFunction(){
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  </script>
</body>
</html>
