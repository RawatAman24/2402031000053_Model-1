<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boot Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- External CSS -->

  <link rel="stylesheet" href="style.css">

  <!-- jQuery -->

  <script
    src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
  </script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#fff3e0;
    }

    /* Heading */

    h1{
      text-align:center;
      color:orange;
      margin:30px 0;
      font-weight:bold;
    }

    /* Carousel */

    .carousel img{
      height:400px;
      object-fit:cover;
      border-radius:10px;
    }

    /* Popup */

    .popup{
      display:none;

      position:fixed;
      left:0;
      top:0;

      width:100%;
      height:100%;

      background:rgba(0,0,0,0.7);

      z-index:999;
    }

    .popup-content{

      background:#fff;

      width:350px;

      margin:8% auto;

      padding:20px;

      border-radius:10px;

      text-align:center;

      position:relative;
    }

    .popup-content img{
      width:100%;
      border-radius:10px;
      margin-bottom:15px;
    }

    .popup-content h2{
      color:orange;
      margin-bottom:10px;
    }

    .popup-content p{
      font-size:18px;
      margin-bottom:20px;
    }

    .popup-content button{

      background:orange;
      color:#fff;

      border:none;

      padding:10px 20px;

      border-radius:5px;

      cursor:pointer;
    }

    .popup-content button:hover{
      background:darkorange;
    }

    /* Close Button */

    .close{

      position:absolute;

      top:10px;
      right:15px;

      font-size:25px;

      color:red;

      cursor:pointer;
    }

    /* Scroll Top Button */

    #topBtn{

      display:none;

      position:fixed;

      bottom:20px;
      right:20px;

      z-index:99;

      border:none;
      outline:none;

      background:orange;
      color:#fff;

      padding:12px 18px;

      border-radius:50%;

      font-size:20px;

      cursor:pointer;
    }

    #topBtn:hover{
      background:darkorange;
    }

  </style>

</head>

<body>

  <!-- Header -->

  <div id="header1"></div>

  <!-- Popup -->

  <div class="popup" id="popup">

    <div class="popup-content">

      <span class="close" id="closeBtn">
        &times;
      </span>

      <img src="shopping (1).webp" alt="Boot">

      <h2> Special Offer </h2>

      <p>
        Get 40% OFF on Boots Today!
      </p>
      
      <a href="menu.html">

        <button>
          Order Now
        </button>
        
          <button>menu</button>

      </a>

    </div>

  </div>

  <!-- Heading -->

  <h1>
    Welcome To Boot Store
  </h1>

  <!-- Bootstrap Carousel -->

  <div
    id="bootSlider"
    class="carousel slide container"
    data-bs-ride="carousel">

    <!-- Indicators -->

    <div class="carousel-indicators">

      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="0"
        class="active">
      </button>

      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="1">
      </button>

      <button
        type="button"
        data-bs-target="#bootSlider"
        data-bs-slide-to="2">
      </button>

    </div>

    <!-- Images -->

    <div class="carousel-inner rounded">

      <div class="carousel-item active">

        <img
          src="shopping (1).webp"
          class="d-block w-100"
          alt="Boot">

      </div>

      <div class="carousel-item">

        <img
          src="shopping (2).webp"
          class="d-block w-100"
          alt="Boot">

      </div>

      <div class="carousel-item">

        <img
          src="shopping (3).webp"
          class="d-block w-100"
          alt="Boot">

      </div>
      <div class="carousel-item">

        <img
          src="shopping (4).webp"
          class="d-block w-100"
          alt="Boot">
          <div class="carousel-item">

        <img
          src="shopping (5).webp"
          class="d-block w-100"
          alt="Boot">

      </div>


      </div>


    </div>

    <!-- Previous Button -->

    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#bootSlider"
      data-bs-slide="prev">

      <span class="carousel-control-prev-icon"></span>

    </button>

    <!-- Next Button -->

    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#bootSlider"
      data-bs-slide="next">

      <span class="carousel-control-next-icon"></span>

    </button>

  </div>

  <!-- Scroll Top Button -->

  <button onclick="topFunction()" id="topBtn">
    ↑
  </button>

  <!-- Footer -->

  <div id="footer1"></div>

  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- External JS -->

  <script src="script.js"></script>

  <!-- Custom JS -->

  <script>

    // Popup Show

    window.onload = function(){

      document.getElementById("popup").style.display = "block";

    }

    // Popup Close

    document.getElementById("closeBtn").onclick = function(){

      document.getElementById("popup").style.display = "none";

    }

    // Scroll Top Button

    let mybutton = document.getElementById("topBtn");

    window.onscroll = function(){

      if(document.body.scrollTop > 100 ||
         document.documentElement.scrollTop > 100){

        mybutton.style.display = "block";

      }
      else{

        mybutton.style.display = "none";
      }
    };
    function topFunction(){

      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;

    }
  </script>
</body>
</html>
